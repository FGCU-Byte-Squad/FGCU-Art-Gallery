name: Build and Release

on:
  push:
    branches:
      - main
      - dev-ops
    tags:
      - 'v*'

# ✅ MUST stay read-only
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # ✅ no write permissions here
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build step
        run: echo "Build placeholder"

  release:
    runs-on: ubuntu-latest
    needs: build

    # ⚠️ write permissions isolated to this job only
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Docker Login
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u USERNAME --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/fgcu-byte-squad/artgallery:latest
